<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>30일 자녀를 위한 기도 챌린지</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; background: #f5f5f0; min-height: 100vh; }
.wrap { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; padding-bottom: 2rem; }
.header { background: #4a6741; padding: 1.25rem 1.25rem 1rem; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
.header h1 { color: #fff; font-size: 15px; font-weight: 600; line-height: 1.4; }
.day-badge { background: rgba(255,255,255,0.22); color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.progress-bar-wrap { background: rgba(255,255,255,0.2); border-radius: 10px; height: 5px; margin-top: 0.5rem; }
.progress-bar { background: #fff; border-radius: 10px; height: 5px; transition: width 0.4s; min-width: 4px; }
.progress-label { color: rgba(255,255,255,0.8); font-size: 11px; margin-top: 5px; text-align: right; }
.day-nav { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.25rem; background: #f8f8f5; border-bottom: 1px solid #e8e8e0; }
.nav-btn { background: #fff; border: 1px solid #d0d0c8; border-radius: 8px; padding: 6px 14px; font-size: 13px; color: #555; cursor: pointer; font-family: inherit; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-btn:active:not(:disabled) { background: #f0f0e8; }
.day-label { font-size: 15px; font-weight: 600; color: #2d3d2c; }
.section { padding: 1rem 1.25rem; border-bottom: 1px solid #f0f0e8; }
.section-title { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 5px; }
.quote-card { background: #f2f6f0; border-left: 3px solid #4a6741; border-radius: 0 8px 8px 0; padding: 0.8rem 1rem; }
.quote-card p { font-size: 13.5px; line-height: 1.8; color: #2d3d2c; font-style: italic; }
.quote-card .attr { font-size: 11px; color: #4a6741; margin-top: 0.5rem; font-style: normal; font-weight: 600; }
.verse-item { padding: 0.65rem 0; border-bottom: 1px solid #f0f0e8; }
.verse-item:last-child { border-bottom: none; }
.verse-ref { font-size: 11px; font-weight: 600; color: #4a6741; margin-bottom: 4px; }
.verse-text { font-size: 13px; line-height: 1.8; color: #333; }
.prayer-text { font-size: 13.5px; line-height: 2; color: #2a2a2a; }
.prayer-text p { margin-bottom: 0.9rem; }
.prayer-text p:last-child { margin-bottom: 0; }
.memo-section { padding: 1rem 1.25rem; }
.memo-label { font-size: 12px; color: #888; margin-bottom: 0.5rem; display: block; font-weight: 500; }
.memo-area { width: 100%; min-height: 100px; resize: vertical; font-size: 14px; line-height: 1.7; font-family: inherit; border: 1px solid #d8d8d0; border-radius: 8px; padding: 0.75rem; background: #fafaf8; color: #333; }
.memo-area:focus { outline: none; border-color: #4a6741; background: #fff; }
.complete-btn { display: block; width: calc(100% - 2.5rem); margin: 0.75rem 1.25rem 0; padding: 0.85rem; background: #4a6741; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; font-family: inherit; }
.complete-btn.done { background: #e8f2e5; color: #4a6741; border: 1.5px solid #4a6741; }
.complete-btn:active { opacity: 0.85; }
.dots-wrap { padding: 1.25rem 1.25rem 0.5rem; }
.dots-label { font-size: 12px; color: #888; margin-bottom: 0.6rem; font-weight: 500; }
.day-dots { display: flex; flex-wrap: wrap; gap: 7px; }
.dot { width: 30px; height: 30px; border-radius: 50%; background: #f5f5f0; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #aaa; cursor: pointer; flex-shrink: 0; font-weight: 500; -webkit-tap-highlight-color: transparent; }
.dot.active { background: #4a6741; color: #fff; border-color: #4a6741; }
.dot.done { background: #d4e8cf; color: #3a5732; border-color: #8aba82; }
.dot.empty { opacity: 0.35; cursor: default; }
.coming-soon { text-align: center; padding: 2.5rem 1rem; color: #999; font-size: 14px; }
.coming-soon-icon { font-size: 36px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-top">
      <h1>30일 자녀를 위한 기도 챌린지</h1>
      <span class="day-badge" id="badge">1 / 30</span>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progbar"></div></div>
    <div class="progress-label" id="proglabel">0일 완료</div>
  </div>

  <div class="day-nav">
    <button class="nav-btn" id="prevBtn" onclick="changeDay(-1)">← 이전</button>
    <span class="day-label" id="dayLabel">📅 1일차</span>
    <button class="nav-btn" id="nextBtn" onclick="changeDay(1)">다음 →</button>
  </div>

  <div id="content"></div>

  <div class="memo-section">
    <span class="memo-label">📝 오늘의 묵상 기록 & 메모</span>
    <textarea class="memo-area" id="memoArea" placeholder="기도를 마치고 마음속에 주신 생각이나 자녀를 향한 다짐을 자유롭게 기록해 보세요..."></textarea>
  </div>
  <button class="complete-btn" id="completeBtn" onclick="toggleComplete()">오늘 기도 완료 체크 ✓</button>

  <div class="dots-wrap">
    <div class="dots-label">전체 진행 현황</div>
    <div class="day-dots" id="dayDots"></div>
  </div>
</div>

<script>
const days = {
1:{title:"기도하는 부모를 둔 자녀",quote:{text:"어떤 지옥도 아들이나 딸을 기도하는 부모로부터 억지로 떼어놓을 수는 없다.",author:"빌리 선데이"},verses:[{ref:"요한복음 15:7",text:"너희가 내 안에 거하고 내 말이 너희 안에 거하면 무엇이든지 원하는 대로 구하라 그리하면 이루리라"},{ref:"예레미야 애가 2:19",text:"네 마음을 주의 얼굴 앞에 물 쏟듯 할지어다 각 길머리에서 주려 혼미한 네 어린 자녀의 생명을 위하여 주를 향하여 손을 들지어다"},{ref:"요한복음 15:16",text:"너희가 나를 택한 것이 아니요 내가 너희를 택하여 세웠나니 이는 너희로 가서 과실을 맺게 하고 또 너희 과실을 항상 있게 하여 내 이름으로 아버지께 무엇을 구하든지 다 받게 하려 함이니라"}],prayer:"주님, 제 자신을 주님께 드립니다.\n\n주님이 원하시는 방법대로 아이를 양육한다는 것은 저의 인간적인 능력 밖에 있음을 깨닫습니다. 저를 도우실 분은 주님이시며, 그래서 저는 주님이 필요함을 알고 있습니다.\n\n저는 주님의 협력자가 되고 싶습니다. 저는 또한 주님의 힘과 인내심도 필요합니다. 주님의 한량없으신 사랑의 분량이 내 속에도 흐르기를 원합니다.\n\n주님의 길을 가르쳐 주시고, 주님의 명령에 순종할 수 있게 하시며, 주님 보시기에 기뻐하시는 일만 할 수 있도록 하여 주옵소서. 주의 영의 아름다움이 내 안에 분명히 나타나사 나로 하여금 경건한 부모 역할을 잘 감당할 수 있게 도와주옵소서. 내게 꼭 필요한 대화의 기술과, 가르치고 양육하는 기술을 주옵소서.\n\n주님이 원하시는 부모로 만들어 주시고, 우리 아이의 삶을 위해 어떻게 기도해야 할지를 가르쳐 주시옵소서.\n\n주님, 주께서 말씀하시기를, \"너희가 기도할 때에 무엇이든지 믿고 구하는 것은 다 받으리라\" (마 21:22)고 하셨습니다. 우리 아이를 위해 기도하라고 깨우쳐 주신 모든 것들을 믿을 수 있도록 나의 믿음을 키워 주시기를 예수님의 이름으로 기도합니다. 아멘."},
2:{title:"하나님의 손에 맡긴 자녀",quote:{text:"아이들을 부모 품안에서 감싸고 부모 혼자 힘으로만 키우면서 하나님이 아이에게 하실 수 있는 일을 제한하도록 해서는 안 됩니다. 하나님 아버지의 장중에 아이를 맡기고 그분이 아이의 생활을 주관하실 것을 믿을 때 우리는 지금보다 더 큰 평안을 누릴 수가 있습니다.",author:""},verses:[{ref:"마태복음 7:11",text:"너희가 악한 자라도 좋은 것으로 자식에게 줄줄 알거든 하물며 하늘에 계신 너희 아버지께서 구하는 자에게 좋은 것으로 주시지 않겠느냐"},{ref:"이사야 65:23",text:"그들의 수고가 헛되지 않겠고 그들의 생산한 것이 재난에 걸리지 아니하리니 그들은 여호와의 복된 자의 자손이요 그 소생도 그들과 함께 될 것임이라"},{ref:"사무엘상 1:27,28",text:"이 아이를 위하여 내가 기도하였더니 여호와께서 나의 구하여 기도한 바를 허락하신지라 그러므로 나도 그를 여호와께 드리되 그의 평생을 여호와께 드리나이다"}],prayer:"주님, 예수님의 이름으로 하나님께 나아갑니다. 그리고 우리 아이를 하나님께 드립니다.\n\n아이에게 가장 좋은 것이 무엇인지, 지금 필요한 것이 무엇인지 하나님만이 아십니다. 아이를 맡기오니 보호하고 인도하여 주시옵소서.\n\n아이를 위해 기도할 때 저 자신의 뜻대로 기도하지 않게 하옵시고, 아이의 인생에 하나님의 뜻이 이루어지기를 위해 기도할 수 있게 하옵소서.\n\n자주 바뀌어 믿을 것이 없는 세상의 자녀 양육 방법을 따르지 않게 하시고, 하나님께 기도할 때 주시는 지혜와 하나님의 말씀으로부터 분명한 지시를 받을 수 있게 해 주셔서 감사합니다.\n\n하나님, 우리 아이를 선물로 주셔서 감사합니다. 하나님께서 아이를 돌보고 양육하라고 주신 줄을 압니다. 이 일을 잘 할 수 있도록 도와주시옵소서.\n\n아이의 어떤 면을 계속 주시해야 하는지 깨닫게 하옵시고, 또한 아이를 하나님의 보호와 인도하심에 맡길 수 있게 하옵소서.\n\n위험의 가능성 때문에 두려워하지 않게 하옵시고, 하나님의 주관하심을 아는 평안과 기쁨의 삶을 살게 하옵소서. 오늘도 우리 아이를 하나님께 맡기오며, 하나님의 손에 드리나이다. 예수님의 이름으로 기도합니다. 아멘."},
3:{title:"사고와 위험에서 보호받는 자녀",quote:{text:"재난이란 어디서든 일어나기 마련입니다. 문제는 기도하는 것과 하나님께서 응답해 주실 줄로 믿는 일입니다. 오늘 우리가 기도하지 아니하면 우리 아이들에게 생길지도 모르는 어려움을 예방할 수 없습니다.",author:""},verses:[{ref:"시편 91:1,2",text:"지존자의 은밀한 곳에 거하는 자는 전능하신 자의 그늘 아래 거하리로다 내가 여호와를 가리켜 말하기를 저는 나의 피난처요 나의 요새요 나의 의뢰하는 하나님이라 하리니"},{ref:"이사야 43:2",text:"네가 물 가운데로 지날 때에 내가 함께할 것이라 강을 건널 때에 물이 너를 침몰치 못할 것이며 네가 불 가운데로 행할 때에 타지도 아니할 것이요"},{ref:"시편 91:9,10",text:"네가 말하기를 여호와는 나의 피난처시라 하고 지존자로 거처를 삼았으므로 화가 네게 미치지 못하며 재앙이 네 장막에 가까이 오지 못하리니"}],prayer:"주님, 우리 아이를 위해 하나님께 기도합니다. 아이의 둘레에 보호의 울타리를 펴주시기를 간구합니다.\n\n그 어떤 종류의 악이나 해도 아이의 영혼과 몸과 마음을 상치 못하도록 보호해 주시옵소서. 사고와 질병, 부상, 또는 다른 신체적, 정신적, 정서적 학대를 당하지 않도록 보호해 주시기를 특별히 기도합니다.\n\n\"이 재앙이 지나가기까지\" 아이가 \"주의 날개 그늘 아래\" (시 57:1) 피하게 하시기를 간구합니다. 아이에게 접근하는 그 어떤 악의 영향으로부터도 숨겨 주시옵소서.\n\n드러나지 않은 위험으로부터 아이를 안전하게 보호해 주시고 모든 흉기로부터 지켜 주시옵소서.\n\n보호해 주시겠다고 여러 번 약속하신 것을 생각할 때 무한 감사합니다. 아이가 하나님의 길로 행하게 하시고 하나님의 뜻에 순종하며 하나님의 보호의 우산 아래서 결단코 벗어나지 않도록 도와주시옵소서.\n\n아이가 무슨 일을 하든지, 어디에 있든지, 안전하게 지켜 주시옵소서. 예수님의 이름으로 기도합니다. 아멘."},
4:{title:"사랑받고 있음을 느낄 줄 아는 자녀",quote:{text:"당신의 인생을 향하신 하나님의 주된 목적 가운데 하나는 당신에게 하나님의 사랑을 물 붓듯 부으셔서 그 사랑이 다른 사람한테까지 흘러넘치도록 하는 것입니다.",author:""},verses:[{ref:"요한복음 15:9,10",text:"아버지께서 나를 사랑하신 것같이 나도 너희를 사랑하였으니 나의 사랑 안에 거하라"},{ref:"시편 143:8",text:"아침에 나로 주의 인자한 말씀을 듣게 하소서 내가 주를 의뢰함이니이다 나의 다닐 길을 알게 하소서 내가 내 영혼을 주께 받듦이니이다"},{ref:"요한일서 4:9-11",text:"하나님의 사랑이 우리에게 이렇게 나타난 바 되었으니 하나님이 자기의 독생자를 세상에 보내심은 저로 말미암아 우리를 살리려 하심이니라 사랑은 여기 있으니 우리가 하나님을 사랑한 것이 아니요 오직 하나님이 우리를 사랑하사 우리 죄를 위하여 화목제로 그 아들을 보내셨음이니라"}],prayer:"주님, 우리 아이가 사랑받고 있음을 느끼게 해 주시기를 간구합니다.\n\n지금 아이의 마음속을 하나님의 사랑으로 채우사, 하나님의 사랑이 얼마나 멀리 뻗치며 또 완전한지를 알 수 있게 도와주시옵소서.\n\n하나님께서 우리를 얼마나 사랑하시는지, 독생자를 보내사 우리를 위해 죽게 하기까지 하셨다고 말씀하셨습니다 (요 3:16). 아이를 사단의 거짓말에서 구하사 사단이 그 애 마음에 의심의 씨앗을 심지 못하게 하옵소서.\n\n주님의 사랑을 아이에게 정말로 나타내사 아이로 하여금 그것을 받아들이게 도와주시옵소서. 주님이 무조건적인 사랑으로 사랑하시듯이 저도 이 아이를 그렇게 사랑하게 도와주시옵소서.\n\n우리 가족 모두가 아이를 사랑하게 하옵시고 아이가 다른 사람들에게도 사랑을 받게 하옵소서. 매일 매일 사랑받고 있다는 자신감 속에 자라나게 하옵시고, 다른 사람에게도 어렵지 않게 사랑을 표현할 줄 아는 능력을 아이 속에 부어 주시옵소서.\n\n아이가 하나님의 사랑의 깊이를 충분히 이해하고 마음속에 받아들이게 되었을 때, 아이를 통하여 다른 사람들에게 주님의 사랑이 흘러넘치는 사랑의 그릇이 되게 하옵소서. 예수님의 이름으로 기도합니다. 아멘."},
5:{title:"영원한 미래가 보장된 자녀",quote:{text:"아이가 주님을 영접했다면, 우리는 그 아이가 주님과 좋은 관계를 갖도록 계속 기도하지 않으면 안 됩니다. 주님의 생명 속에는 우리 각자가 문을 열고 들어가 체험해야 할 비밀들이 무궁무진합니다.",author:""},verses:[{ref:"로마서 10:9",text:"네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 얻으리라"},{ref:"요한복음 6:40",text:"내 아버지의 뜻은 아들을 보고 믿는 자마다 영생을 얻는 이것이니 마지막 날에 내가 이를 다시 살리리라 하시니라"},{ref:"요한일서 5:20",text:"또 아는 것은 하나님의 아들이 이르러 우리에게 지각을 주사 우리로 참된 자를 알게 하신 것과 또한 우리가 참된 자 곧 그의 아들 예수 그리스도 안에 있는 것이니 그는 참 하나님이시요 영생이시라"}],prayer:"주님, 우리 아이를 주님께 맡깁니다. 주님이 누구신지 아이가 깊이 알게 되기를 간절히 기도합니다.\n\n아이의 마음을 여시고 주님에 관한 진리를 온전히 깨닫게 하시기를 원합니다. 아이가 예수님을 자신의 구주라고 부르게 하옵시고, 성령으로 채우시며, 자기 인생 모든 영역에서 주님을 인정하게 하옵시고, 언제나 주님을 따르며 주님의 길로만 가게 인도하옵소서.\n\n아이를 붙드사 주님의 완전한 용서를 이해하고 죄책감과 정죄 속에서 살아가지 않도록 하옵소서. 아이가 열매 맺는 삶을 살게 하옵시고 주님을 아는 지식이 늘 자라나게 하옵소서.\n\n주님의 뜻을 알게 하옵시고, 영적인 분별력이 있게 하옵시고, 하나님 보시기에 기뻐하실 길로만 다니게 하옵소서.\n\n주님께서 성령을 오늘 우리 아이에게 부어주시기를 간절히 기도합니다. 우리 아이의 평생 동안 주님이 예비하신 그 길에서 떠나거나 의심하지 않게 되기를 예수님의 이름으로 기도합니다. 아멘."},
6:{title:"부모를 공경하며 반항하지 않는 자녀",quote:{text:"어느 땐가는 당신의 자녀도 반항의 고개를 들 날이 있을 것입니다. 기도와 하나님의 말씀으로 그 도전장을 받을 준비를 하십시오. 반항심에 겁먹지 마십시오. 예수께서는 그것을 다스리실 수 있는 능력의 주님이십니다.",author:""},verses:[{ref:"골로새서 3:20",text:"자녀들아 모든 일에 부모에게 순종하라 이는 주 안에서 기쁘게 하는 것이니라"},{ref:"이사야 1:19,20",text:"너희가 즐겨 순종하면 땅의 아름다운 소산을 먹을 것이요 너희가 거절하여 배반하면 칼에 삼키우리라 여호와의 입의 말씀이니라"},{ref:"잠언 1:8,9",text:"내 아들아 네 아비의 훈계를 들으며 네 어미의 법을 떠나지 말라 이는 네 머리의 아름다운 관이요 네 목의 금 사슬이니라"}],prayer:"주님, 우리 아이에게 하나님께 순종하려는 마음을 주시기를 기도합니다. 주님과 더불어 시간을 보내고 싶은 마음을 아이에게 주옵시고, 주님의 말씀과 기도에 힘쓰며, 주님의 음성을 듣게 하옵소서.\n\n아이의 마음에 뿌리를 내리고 있는 눈에 보이지 아니하는 은밀한 반항심 위에 주님의 빛을 비추사 그 정체를 알게 하시고 파괴시켜 주시옵소서.\n\n주님, 아이가 교만과 이기심, 반항심에 빠지지 않도록 하옵시고 거기에서 구원받게 하옵소서. 예수님의 이름으로 주신 그 권세에 의지하여 사단의 궤계를 대적하오며, 우상 숭배와 거역과 고집과 불경을 배척합니다.\n\n아이의 마음을 부모에게로 향하게 하사 어머니와 아버지를 공경하고 순종할 줄 알게 하옵소서. 그래서 아이의 생명이 길고 또한 복되게 하옵소서.\n\n주님께 순종하며 섬기며 사랑과 겸손한 마음으로 행하는 것이 얼마나 아름답고 좋은 것인지 깨닫게 하옵소서. 예수님의 이름으로 기도합니다. 아멘."},
7:{title:"가족 관계를 중시하는 자녀",quote:{text:"가족 간의 단결을 회복하고, 주님 안에서 유대 관계를 유지하며, 여러 세대를 거쳐 영원히 지속될 수 있는 단합이라는 경건한 유산을 남기는 것은 하나님이 원하시는 일입니다.",author:""},verses:[{ref:"베드로전서 3:8",text:"너희가 다 마음을 같이 하여 체휼하며 형제를 사랑하며 불쌍히 여기며 겸손하며"},{ref:"마태복음 5:9",text:"화평케 하는 자는 복이 있나니 저희가 하나님의 아들이라 일컬음을 받을 것임이요"},{ref:"고린도전서 1:10",text:"형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 권하노니 다 같은 말을 하고 너희 가운데 분쟁이 없이 같은 마음과 같은 뜻으로 온전히 합하라"}],prayer:"주님, 우리 아이가 다른 가족들과 좋은 관계를 갖게 도와주시옵소서. 문제를 해결하지 않은 채 언짢은 관계로 지내거나 영원한 결별을 선언하는 일이 없게 하소서.\n\n아이의 마음을 주님의 사랑으로 충만하게 하옵시고 남을 동정하는 마음과 용서하는 마음을 주셔서 그것들이 다른 식구들에게도 흘러넘치게 하옵소서.\n\n가족들이 언제나 서로의 뜻을 잘 전달할 수 있도록 도와주시고, 용서하지 못하는 마음이 뿌리 내리지 못하도록 하옵소서. 서로 사랑하며, 서로 귀중히 여기며, 서로 감사하며, 또 서로 존중하여 하나님이 정해주신 이 관계가 깨어지지 않도록 인도하옵소서.\n\n끊어지지 않는 튼튼한 동아줄처럼, 다른 가족을 사랑하고 불쌍히 여기는 마음을 아이에게 불어넣어 주시옵기를 예수님의 이름으로 기도합니다. 아멘."},
8:{title:"본이 될 만한 사람과 경건한 친구가 있는 자녀",quote:{text:"당신의 아이를 곁길로 빠지게 하는 사람을 동정하지 마십시오. 우리 아이들의 삶에 가장 큰 영향력을 끼치는 사람은 그 아이의 친구들과 자기 역할을 잘 감당하고 있는 주변 사람들입니다.",author:""},verses:[{ref:"잠언 13:20",text:"지혜로운 자와 동행하면 지혜를 얻고 미련한 자와 사귀면 해를 받느니라"},{ref:"고린도전서 5:11",text:"이제 내가 너희에게 쓴 것은 만일 어떤 형제라 일컫는 자가 음행하거나 탐람하거나 우상 숭배를 하거나 후욕하거나 술 취하거나 토색하거든 사귀지도 말고 그런 자와는 함께 먹지도 말라 함이라"},{ref:"시편 1:1",text:"복 있는 사람은 악인의 꾀를 좇지 아니하며 죄인의 길에 서지 아니하며 오만한 자의 자리에 앉지 아니하고"}],prayer:"주님, 우리 아이의 인생에 경건한 친구들과 좋은 본이 되는 사람들을 만나게 해 주시옵소서.\n\n경건한 친구들을 선택할 줄 아는 지혜를 주옵시고, 다른 사람과 친해지기 위해서 하나님과 동행하는 삶을 타협하는 일이 없도록 도와주시옵소서.\n\n경건한 영향을 끼치지 못하는 사람은 누구라도 아이의 삶에서 떨어져 나가게 하거나, 아니면 주님을 닮은 사람으로 변화시켜 주시옵소서.\n\n친구를 잃어서 슬퍼할 때 우리 아이를 위로해 주옵시고, 새 친구를 보내주사 서로 기쁨과 슬픔을 함께 나누며 주께서 주신 각자의 개성을 서로 아껴줄 수 있게 하옵소서.\n\n주님께서 진정한 우정의 의미를 우리 아이에게 가르쳐 주옵소서. 아이의 친구 관계 하나하나가 주님을 영화롭게 하는 것이 되게 하옵소서. 예수님의 이름으로 기도합니다. 아멘."},
9:{title:"하나님의 것을 사모하는 자녀",quote:{text:"만일 우리가 성경의 진리들을 충실하게 가르치고 그 교훈대로 살아가도록 우리 자녀들을 돕는다면, 그들은 홍수 속에서도 닻을 내릴 것이고, 확실한 토대를 갖게 될 것이다.",author:""},verses:[{ref:"잠언 14:27",text:"여호와를 경외하는 것은 생명의 샘이라 사망의 그물에서 벗어나게 하느니라"},{ref:"갈라디아서 2:20",text:"내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 산 것이 아니요 오직 내 안에 그리스도께서 사신 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 몸을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라"},{ref:"시편 86:11,12",text:"여호와여 주의 도로 내게 가르치소서 내가 주의 진리에 행하오리니 일심으로 주의 이름을 경외하게 하소서 주 나의 하나님이여 내가 전심으로 주를 찬송하고 영영토록 주의 이름에 영화를 돌리오리니"}],prayer:"주님, 우리 아이가 날이 갈수록 더욱 하나님을 갈망하기를 기도합니다.\n\n아이가 주님의 임재를 바라게 하옵시고, 기도와 찬양, 예배를 통해 주님과 함께하는 시간을 기뻐하게 하여 주시옵소서. 하나님의 진리의 말씀을 사모하게 하옵시고, 하나님의 율법과 도를 사랑하는 마음을 주시옵소서.\n\n하나님을 떠나 다른 어떤 것에 마음을 빼앗기지 않게 하옵시고, 경건치 못한 것과 하나님을 대적하는 모든 것들을 물리치게 하옵소서.\n\n교만과 게으름과 나태, 이기심 또는 육신의 정욕에서 아이를 건져 주시옵소서. 마음에 언제나 성령의 불이 타오르게 하사 하나님의 일을 하고 싶어하는 마음을 확고히 가지게 하옵소서. 예수님의 이름으로 기도합니다. 아멘."},
10:{title:"자기 모습을 사랑할 줄 아는 자녀",quote:{text:"아이들이 자기의 강점을 보게 하고, 자기의 약점에 과도히 신경쓰지 않게 도와주는 것은 하나님께서 주신 지혜의 일부분입니다. \"나는 하나님의 것이야\" 하고 자신있게 말할 수 있는 아이의 얼굴은 자신감으로 빛납니다.",author:""},verses:[{ref:"고린도전서 7:24",text:"형제들아 각각 부르심을 받은 그대로 하나님과 함께 거하라"},{ref:"베드로전서 2:9",text:"오직 너희는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요 그의 소유된 백성이니 이는 너희를 어두운 데서 불러 내어 그의 기이한 빛에 들어가게 하신 자의 아름다운 덕을 선전하게 하려 하심이라"},{ref:"베드로후서 1:10",text:"그러므로 형제들아 더욱 힘써 너희 부르심과 택하심을 굳게 하라 너희가 이것을 행한즉 언제든지 실족치 아니하리라"}],prayer:"주님, 지금 이 시간 성령을 우리 아이에게 부어주셔서 하나님께서 원하시는 사람이 되고 하나님께서 원하시는 삶을 살아갈 수 있도록 하여 주시옵소서.\n\n사단의 악한 계책에서 아이를 건져 주시사, 아이만이 가지고 있는 독특한 개성과 재능을 훔쳐가지 못하게 하옵시고, 하나님이 창조하신 아이의 본연의 모습을 파괴하지 못하게 하옵소서.\n\n사랑과 희락, 화평과 인내, 자비와 양선, 믿음과 온유와 절제 등 성령의 열매 (갈 5:22)가 아이 속에서 날마다 자라나게 하옵소서.\n\n주님 안에서 자기가 누구인지를 발견하게 하옵시고, 자신을 주님의 도구로 보게 하옵시며, 주님 안에서 자신이 온전함을 알게 하옵소서.\n\n하나님이 지으신 본연의 자기 모습에 전심함으로써 자신감을 갖게 하시며 성령께서 주시는 담대함이 날마다 자라나게 하옵소서. 예수님의 이름으로 기도합니다. 아멘."},
11:{title:"거짓을 버리고 진리를 따르는 자녀",quote:{text:"거짓말에 대해 하나님의 말씀이 무엇이라고 말씀하시는지 우리가 아이들에게 가르치지 않는다면, 아이들은 왜 거짓말이 나쁜지 모를 것입니다. 거짓의 영이 아이 속에서 뿌리채 뽑혀지기를 지금 기도하십시오.",author:""},verses:[{ref:"요한복음 16:13",text:"진리의 성령이 오시면 그가 너희를 모든 진리 가운데로 인도하시리니"},{ref:"잠언 12:22",text:"거짓 입술은 여호와께 미움을 받아도 진실히 행하는 자는 그의 기뻐하심을 받느니라"},{ref:"시편 119:28,29",text:"나의 영혼이 눌림을 인하여 녹사오니 주의 말씀대로 나를 세우소서 거짓 행위를 내게서 떠나게 하시고 주의 법을 내게 은혜로이 베푸소서"}],prayer:"주님, 우리 아이를 진리의 영으로 충만케 하시기를 기도합니다. 아이에게 진실을 사랑하고 따르려는 마음을 주시옵소서. 그리고 모든 거짓은 마귀에게서 비롯된 것임을 알아서 배척하게 하옵소서.\n\n거짓말을 할 때마다 자기의 마음 한 조각을 사단에게 내어주는 것임을 깨닫도록 도와주시옵고, 거짓말을 함으로써 혼란과 죽음이 오며, 하나님의 임재로부터 멀어져 간다는 것을 깨닫게 하옵소서.\n\n거짓말을 하고서도 벌을 받지 않고 지나가는 일이 없기를 기도합니다. 모든 거짓은 빛 가운데 드러나게 해주시옵소서.\n\n성령께서 우리 아이를 모든 진리 가운데로 인도해 주시기를 기도합니다. 진리의 영을 열심히 좇는 정직한 사람이 되게 하여 주시옵소서. 예수님의 이름으로 기도합니다. 아멘."},
12:{title:"건강과 치유의 삶을 누리는 자녀",quote:{text:"예수님은 우리 죄를 용서하며 우리 몸의 질병을 치료하기를 원하십니다. 부모 된 우리가 평소 늘 기도함으로써 우리 아이들을 위해 주님이 주시는 건강과 치료를 꽉 붙잡도록 합시다.",author:""},verses:[{ref:"시편 107:20",text:"저가 그 말씀을 보내어 저희를 고치사 위경에서 건지시는도다"},{ref:"야고보서 5:16",text:"이러므로 너희 죄를 서로 고하며 병 낫기를 위하여 서로 기도하라 의인의 간구는 역사하는 힘이 많으니라"},{ref:"말라기 4:2",text:"내 이름을 경외하는 너희에게는 의로운 해가 떠올라서 치료하는 광선을 발하리니"}],prayer:"주님, 우리 아이가 항상 치료받고 온전해지기를 위해 기도합니다. 질병의 세력이 아이의 인생에 틈타지 못하게 하옵소서.\n\n기도하오니 아이의 몸이 아플 때마다 주님의 치료의 권능으로 만져 주시고 완전히 건강하게 회복시켜 주시옵소서.\n\n우리가 의사의 진찰을 받아야 한다면 누구한테 받아야 할지 인도해 주시기를 원합니다. 또 그 의사가 가장 좋은 치료 방법을 깨닫도록 지혜와 지식을 주시기를 원합니다.\n\n우리 아이의 건강한 삶과 치료해 주심과 온전한 건강을 위해 주님만을 바라보오니 도와주소서. 예수님의 이름으로 기도합니다. 아멘."},
13:{title:"적절하게 신체 관리를 할 줄 아는 자녀",quote:{text:"아이가 아직 어리다면, 건강에 좋은 음식에 끌리게 해달라고 기도를 시작하십시오. 자기 몸을 위해 어떻게 하는 것이 옳은지 성령께서 아이들을 인도하시고 힘을 주셔야 합니다.",author:""},verses:[{ref:"고린도전서 6:19,20",text:"너희 몸은 너희가 하나님께로부터 받은 바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희의 것이 아니라 값으로 산 것이 되었으니 그런즉 너희 몸으로 하나님께 영광을 돌리라"},{ref:"로마서 12:1",text:"그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니 너희 몸을 하나님이 기뻐하시는 거룩한 산 제사로 드리라 이는 너희의 드릴 영적 예배니라"},{ref:"고린도전서 10:31",text:"그런즉 너희가 먹든지 마시든지 무엇을 하든지 다 하나님의 영광을 위하여 하라"}],prayer:"주님, 우리 아이의 마음속에 건강에 좋은 음식을 먹고 싶어하는 생각을 주시기를 간구합니다.\n\n아이를 도우사 자신이 살아가야 할 길에 대해 진리를 알게 하옵시고, 건강에 해로운 습관에서 자유하게 하옵소서.\n\n적절한 식욕과 더불어, 규칙적인 운동을 하게 하옵시고, 자기 몸을 하나님께서 주신 것으로 귀하게 여기게 하옵시고, 잘 관리하게 하옵소서.\n\n진정한 매력은 하나님을 사랑하는 사람의 마음 안에서 시작된다는 것을 이해하게 도와 주시옵소서. 자기 몸이 성령의 전이니까 잘 관리해야겠다는 마음을 영원토록 갖게 하여 주옵소서. 예수님의 이름으로 기도합니다. 아멘."},
14:{title:"배움의 의욕을 가진 자녀",quote:{text:"참다운 지식과 이해는 주님과 함께 시작하며, 주님으로부터 옵니다. 영원토록 하나님께 배우는 아이가 되게 해달라고 기도하십시오. 하나님께서 도와주신다면, 지혜롭고 참다운 지식을 소유한 아이로 성장할 것입니다.",author:""},verses:[{ref:"잠언 1:7",text:"여호와를 경외하는 것이 지식의 근본이어늘 미련한 자는 지혜와 훈계를 멸시하느니라"},{ref:"이사야 54:13",text:"네 모든 자녀는 여호와의 교훈을 받을 것이니 네 자녀는 크게 평강할 것이며"},{ref:"잠언 1:5",text:"지혜 있는 자는 듣고 학식이 더할 것이요 명철한 자는 모략을 얻을 것이라"}],prayer:"주님, 우리 아이가 하나님의 법도를 깊이 경외하기를 기도합니다. 아이가 하나님 말씀을 자기 마음에 보물같이 간직하게 하옵시고, 금이나 은을 찾는 것처럼 지식을 추구하게 하여 주옵소서.\n\n맑은 정신과 가르침을 받으려고 하는 정신과 또 학습 능력을 주시옵소서. 기도하오니 아이가 부모의 가르침을 기쁘게 받게 하여 주옵소서.\n\n하나님, 좋은 선생님을 만나게 하여 주시고, 학교에서 성적이 뛰어나게 하여 주옵시고, 아이의 두뇌의 모든 것들이 정상적으로 잘 연결되게 하셔서, 생각이 맑게 하여 주시고, 기억력이 좋고, 학습 능력이 높도록 하여 주옵소서.\n\n하나님, 아이가 하나님과 그 말씀에 대하여 알아가는 기쁨을 많이 경험할 수 있게 하여 주옵소서. 예수님의 이름으로 기도합니다. 아멘."},
15:{title:"하나님께서 주신 재능과 은사를 알고 있는 자녀",quote:{text:"아이마다 특별한 재능과 소질이 있습니다. 우리는 아이들이 어떤 것에 소질을 가지고 있는지 알아야 하고, 그것을 밖으로 드러내게 해서 개발시켜 주어야 하며, 잘 가꾸어서 하나님의 영광을 위하여 사용하도록 도와주어야 합니다.",author:""},verses:[{ref:"잠언 18:16",text:"선물은 그 사람의 길을 너그럽게 하며 또 존귀한 자의 앞으로 그를 인도하느니라"},{ref:"에베소서 4:7",text:"우리 각 사람에게 그리스도의 선물의 분량대로 은혜를 주셨나니"},{ref:"야고보서 1:17",text:"각양 좋은 은사와 온전한 선물이 다 위로부터 빛들의 아버지께로서 내려오나니 그는 변함도 없으시고 회전하는 그림자도 없으시니라"}],prayer:"주님, 주께서 우리 아이에게 주신 소질과 재능을 인하여 주님께 감사합니다. 저와 제 아이에게 이것들을 밝히 보여 주시고, 특히 제가 아이를 위하여 제공해 주어야 하는 특별한 훈련이나 배움의 기회가 있는지 알려 주시옵소서.\n\n아이가 인생에 대한 하나님의 부르심의 소리를 듣게 하사, 하나님이 부르신 소명이 무엇인가 찾느라고 평생을 허비하는 일이 없게 하여 주옵소서.\n\n아이의 재능이 허비되거나, 2류가 되거나, 하나님이 아닌 다른 것을 영화롭게 하는 것이 되지 않게 하여 주옵소서. 아이의 평생에 하여야 할 일이 무엇인지 밝히 보여 주시고, 그 분야에서 뛰어나게 도와주시옵소서.\n\n하나님께서 아이에게 심어주신 소질과 재능이 하나님을 영화롭게 하는 데서 최대한으로 발휘되게 하여 주옵소서. 예수님의 이름으로 기도합니다. 아멘."},
16:{title:"생명의 말씨를 쓰는 자녀",quote:{text:"말에는 생명이 있습니다. 그래서 말로 생명을 불어넣을 수도 있고, 사망을 불어 넣을 수도 있습니다. 하나님께서 우리 아이의 입에 파수꾼을 세워주시도록 기도하여야 합니다.",author:""},verses:[{ref:"잠언 21:23",text:"입과 혀를 지키는 자는 그 영혼을 환난에서 보전하느니라"},{ref:"마태복음 12:36,37",text:"내가 너희에게 이르노니 사람이 무슨 무익한 말을 하든지 심판 날에 이에 대하여 심문을 받으리니 네 말로 의롭다 함을 받고 네 말로 정죄함을 받으리라"},{ref:"잠언 16:24",text:"선한 말은 꿀송이 같아서 마음에 달고 뼈에 양약이 되느니라"}],prayer:"주님, 우리 아이가 하나님을 영화롭게 하는 말만을 해야겠다고 결심하게 하옵소서.\n\n아이의 마음을 성령과 진리로 충만하게 하셔서 입에서 사망이 아닌 생명의 말이 흘러 넘치게 하여 주옵소서. 아이의 입에 파수꾼을 세워 두사 하나님을 모독하는 말, 부정적이고 잔인한 말, 남에게 상처를 주는 말 등을 쓰고 싶은 유혹이 마음에 들어갔을 때는 마음이 편안하지 않게 만들어 주옵소서.\n\n아이가 소망과 격려의 말, 건강한 말과 생명의 말을 할 줄 알게 하옵시고, 입술의 죄를 짓지 않겠다고 결심하게 도와주시옵소서. 듣는 데는 빠르고 말하는 것은 더디 하게 하사, 우리 아이의 말이 항상 은혜로 양념을 친 것 같이 하옵소서. 예수님의 이름으로 기도합니다. 아멘."},
17:{title:"거룩함과 정결함에 끌리는 자녀",quote:{text:"아이가 마치 자석처럼 성결과 정결에 끌리도록 기도합시다. 그래서 성결하거나 정결하지 못한 것이 우리 아이들을 미혹할 때, 재빨리 알아차려서 그것을 철저하게 거부하지 않고서는 불편해서 견디지 못하게 합시다.",author:""},verses:[{ref:"마태복음 5:8",text:"마음이 청결한 자는 복이 있나니 저희가 하나님을 볼 것임이요"},{ref:"시편 24:3-5",text:"여호와의 산에 오를 자 누구며 그 거룩한 곳에 설 자가 누군고 곧 손이 깨끗하며 마음이 청결하며 뜻을 허탄한데 두지 아니하며 거짓 맹세치 아니하는 자로다 저는 여호와께 복을 받고 구원의 하나님께 의를 얻으리니"},{ref:"데살로니가전서 4:7",text:"하나님이 우리를 부르심은 부정케 하심이 아니요 거룩케 하심이니"}],prayer:"주님, 우리 아이가 어떤 것이나 어떤 사람을 사랑하는 것보다도 하나님을 더욱 사랑하게 하여 주옵소서.\n\n아이가 하나님의 법을 존중하고 경외하게 도와주시고, 그 법이 자신의 유익을 위하여 있는 것임을 알게 도와주시옵소서. 하나님의 말씀을 아이의 마음에 숨겨 주셔서 죄에 끌리지 않도록 하여 주시옵소서.\n\n악과 부정과 거룩하지 못한 생각과 말과 행동으로부터 도망치게 하여 주시고, 무엇이든지 정결하고 거룩한 것을 행하여 끌리도록 하여 주시옵소서.\n\n아이가 성결의 길에서 벗어났을 때 회개하도록 인도하여 주옵시고, 하나님의 정결케 하는 능력이 마음과 삶에 역사하여 주시길 기도합니다. 예수님의 이름으로 기도합니다. 아멘."},
18:{title:"영적인 방청소가 필요한 자녀",quote:{text:"하나님의 것으로부터 우리 아이들이 시선을 돌려놓게 하는 것들이 이 세상에는 너무나 많습니다. 우리는 하나님의 도리대로 아이들을 가르치고 훈육하며 훈련시키는 등, 우리의 몫을 다해야 합니다.",author:""},verses:[{ref:"시편 101:2,3",text:"내가 완전한 길에 주의하오리니 주께서 언제나 내게 임하시겠나이까 내가 완전한 마음으로 내 집안에서 행하리이다 나는 비루한 것을 내 눈 앞에 두지 아니할 것이요 배도자들의 행위를 미워하니 이것이 내게 붙접지 아니하리이다"},{ref:"신명기 7:26",text:"너는 가증한 것을 네 집에 들이지 말라 너도 그와 같이 진멸 당할 것이 될까 하노라 너는 그것을 극히 꺼리며 심히 미워하라 그것은 진멸 당할 것임이니라"},{ref:"고린도후서 7:1",text:"그런즉 사랑하는 자들아 이 약속을 가진 우리가 하나님을 두려워하는 가운데서 거룩함을 온전히 이루어 육과 영의 온갖 더러운 것에서 자신을 깨끗케 하자"}],prayer:"주님, 당신의 영인 성령께서 우리 아이의 방에 오셔서 거하기를 간구합니다. 주님의 빛과 생명으로 이 방을 채워 주시옵소서.\n\n이 방에 침투하려는 어두움의 세력을 다 몰아내 주시고, 두려움과 낙심의 영, 분노와 의심의 영, 불안과 반항의 영, 증오의 영은 이 방에서 발붙일 곳도 찾지 못하게 하여 주시옵소서.\n\n하나님께서 보내신 것이 아닌 것은 아무것도 이 방에 들어오지 못하게 하여 주시옵소서. 이 방에 있어서는 안 될 것들이 있으면 저에게 보여 주시사 버리게 하옵소서.\n\n이 방을 하나님의 사랑과 평화와 기쁨으로 가득 채워 주옵소서. 하나님께서 이 방을 거룩한 곳으로 만들어 주시고 하나님의 영광을 위하여 깨끗하게 하여 주옵소서. 예수님의 이름으로 기도합니다. 아멘."},
19:{title:"공포에서 해방된 자녀",quote:{text:"우리에게는 예수께서 계시기 때문에 우리나 우리 아이들은 절대로 공포의 영과 함께 살거나 그것을 삶의 한 방식으로 받아들일 필요가 없습니다.",author:""},verses:[{ref:"시편 34:4",text:"내가 여호와께 구하매 내게 응답하시고 내 모든 두려움에서 나를 건지셨도다"},{ref:"디모데후서 1:7",text:"하나님이 우리에게 주신 것은 두려워하는 마음이 아니요 오직 능력과 사랑과 근신하는 마음이니"},{ref:"이사야 41:10",text:"두려워 말라 내가 너와 함께함이니라 놀라지 말라 나는 네 하나님이 됨이니라 내가 너를 굳세게 하리라 참으로 너를 도와주리라 참으로 나의 의로운 오른손으로 너를 붙들리라"}],prayer:"하나님께서 나의 기도를 들으시는 줄 믿고 오늘 이 시간 하나님을 바라봅니다.\n\n기도하옵나니, 아이를 사로잡으려고 위협하는 그 모든 두려움에서 우리 아이를 구원하여 주옵소서. 하나님의 사랑으로 아이를 감싸주사 모든 두려움과 의심을 다 씻어 주시옵소서.\n\n아이에게 건전한 마음을 주셔서, 사단이 제시하는 것은 모두 거짓 증거임을 깨닫게 하여 주시고, 그것은 현실과는 아무 상관도 없는 것임을 깨닫게 하여 주옵소서.\n\n아이를 도우사 자기의 두려움을 부인하지 않게 하옵시고, 그 두려움을 하나님께 기도로 가지고 나오게 하옵소서. 오늘 우리 아이에게 두려움으로부터의 자유를 주시기를 예수님의 이름으로 기도합니다. 아멘."},
20:{title:"건전한 정신을 가진 자녀",quote:{text:"세상에서 나오는 것들로 우리 마음을 채우면, 우리에게는 혼란이 옵니다. 우리 마음을 하나님의 것들로 채우면, 생각이 맑아지고 마음에 평화가 옵니다.",author:""},verses:[{ref:"로마서 12:2",text:"너희는 이 세대를 본받지 말고 오직 마음을 새롭게 함으로 변화를 받아 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하도록 하라"},{ref:"에베소서 4:23,24",text:"오직 심령으로 새롭게 되어 하나님을 따라 의와 진리의 거룩함으로 지으심을 받은 새사람을 입으라"},{ref:"이사야 26:3",text:"주께서 심지가 견고한 자를 평강에 평강으로 지키시리니 이는 그가 주를 의뢰함이니이다"}],prayer:"주님, 우리에게 건전한 마음을 약속해 주시니 참으로 감사합니다. 우리 아이에게 그 약속을 시행해 주옵소서.\n\n아이의 마음이 투명하고 깨어 있으며, 총명하고 안정되어 있고 평화로우며 단정하게 되기를 기도합니다. 언제나 올바르게 생각할 수 있도록 생각의 명료함을 주시기 원합니다. 분명한 결정을 할 수 있는 능력을 주옵시고, 자기가 꼭 해야 할 일에 집중할 수 있는 힘을 주시옵소서.\n\n우리 아이가 온 마음과 정성과 뜻을 다하여 주님을 사랑함으로, 그 마음속에 마귀의 거짓말이나 세상의 분요한 생각들이 파고 들어올 틈이 전혀 없게 하여 주시옵소서.\n\n하나님과 하나님의 말씀에 대한 믿음이 날로 날로 자라서 마음이 평화롭고 건전한 가운데 평생 살아가도록 도와주시옵소서. 예수님의 이름으로 기도합니다. 아멘."},
21:{title:"주님의 기쁨을 간직한 자녀",quote:{text:"부정적인 감정들이 삶의 한 방식이 되어서는 안됩니다. 그러므로 우리는 하나님을 바라보아야 합니다. 아이의 얼굴에 평화와 행복, 기쁨이 있습니까? 아니면 심통, 좌절감, 불만, 분노, 의기소침, 슬픔입니까?",author:""},verses:[{ref:"시편 118:24",text:"이 날은 여호와의 정하신 것이라 이 날에 우리가 즐거워하고 기뻐하리로다"},{ref:"요한복음 15:10,11",text:"내가 아버지의 계명을 지켜 그의 사랑 안에 거하는 것같이 너희도 내 계명을 지키면 내 사랑 안에 거하리라 내가 이것을 너희에게 이름은 내 기쁨이 너희 안에 있어 너희 기쁨을 충만하게 하려 함이니라"},{ref:"로마서 15:13",text:"소망의 하나님이 모든 기쁨과 평강을 믿음 안에서 너희에게 충만케 하사 성령의 능력으로 소망이 넘치게 하시기를 원하노라"}],prayer:"주님, 우리 아이가 기쁨이라는 선물을 받게 하여 주시기를 기도합니다. 오늘 기쁨의 영이 이 아이의 마음속에 일어나서 오직 하나님의 임재 안에서만 발견할 수 있는 충만한 기쁨을 깨닫게 하여 주옵소서.\n\n참된 행복과 기쁨은 오직 하나님 안에서만 찾을 수 있음을 이해하게 하옵소서. 부정적인 감정에 사로잡힐 때마다 하나님의 사랑으로 감싸 주옵소서.\n\n절망과 의기소침, 고독, 낙심, 분노, 소외감 등에서 건짐을 받게 하옵소서. 이러한 부정적인 태도들은 아이 속에 자리를 잡지 못하게 하시고, 인생의 지속적인 한 부분이 되지도 말게 하옵소서.\n\n아이를 하나님의 사랑 안에 거하게 하시고, 오늘과 영원토록 주님이 주시는 기쁨으로부터 힘을 얻게 하여 주옵소서. 예수님의 이름으로 기도합니다. 아멘."},
23:{title:"알콜, 마약, 기타 다른 중독을 피하는 자녀",quote:{text:"당신은 하나님의 보좌 앞에서 자녀들을 위해 변호할 수가 있습니다. 당신은 능력과 권세를 가지고 있습니다. 예수 그리스도는 당신의 자녀를 포함한 당신 인생의 모든 것을 다스리시는 주님이십니다.",author:""},verses:[{ref:"잠언 14:12",text:"어떤 길은 사람의 보기에 바르나 필경은 사망의 길이니라"},{ref:"고린도전서 10:21",text:"너희가 주의 잔과 귀신의 잔을 겸하여 마시지 못하고 주의 상과 귀신의 상에 겸하여 참예치 못하리라"},{ref:"로마서 8:13",text:"너희가 육신대로 살면 반드시 죽을 것이로되 영으로써 몸의 행실을 죽이면 살리니"}],prayer:"주님, 우리 아이가 알콜 중독이나 마약 중독, 그 외 어떤 중독이든 걸리지 않도록 주님께서 지켜 주시기를 기도합니다.\n\n아이를 주님 안에서 강하게 하옵시고 가까이 이끄시어 자기 생활을 통제할 수 있는 능력을 주옵소서. 아이가 행해야 할 길을 마음에 일러 주시고 보여 주옵소서.\n\n자기 몸을 파괴시키는 것으로부터 자기 몸을 보호하는 것은 하나님께 대한 사명임을 깨닫도록 도와주소서.\n\n술과 마약을 이용해서 아이 인생을 망치려는 사단의 음모를 하나님께서 깨뜨려 주시옵기를 기도하나이다. 이런 것들에 끌리기 쉬운 어떤 성향이 아이 성격 속에 있사오면 그것들을 모두 제거해 주옵소서.\n\n사망을 불러들이는 것들에게는 \"아니오\"라고 말하고, 생명을 가져오는 하나님의 것들에게는 \"예\" 할 수 있는 분별력과 힘을 주옵소서.\n\n아이가 유혹을 받을 때마다 이 진리를 분명히 볼 수 있게 하옵시고, 올무에 걸릴 때마다 사단에게서 구원해 주옵소서. 아이가 무엇을 하건 생명의 길을 선택하게 하옵시고, 오직 하나님께만 전심하게 하여 주옵소서.\n\n아이가 몸으로 하는 일 모두가 하나님께 영광이 되게 하옵기를 예수님의 이름으로 기도합니다. 아멘."},
22:{title:"잘못된 집안 내력에서 구출받는 자녀",quote:{text:"예수의 이름으로 우리 집안의 모든 잘못된 굴레에서 우리는 해방될 수 있습니다. 성령의 능력으로 그 굴레가 아이의 일생에 발붙일 곳을 찾지 못하게 해야 합니다.",author:""},verses:[{ref:"요한일서 1:9",text:"만일 우리가 우리 죄를 자백하면 저는 미쁘시고 의로우사 우리 죄를 사하시며 모든 불의에서 우리를 깨끗케 하실 것이요"},{ref:"누가복음 10:19",text:"내가 너희에게 뱀과 전갈을 밟으며 원수의 모든 능력을 제어할 권세를 주었으니 너희를 해할 자가 결단코 없으리라"},{ref:"이사야 61:1",text:"주 여호와의 신이 내게 임하셨으니 이는 여호와께서 내게 기름을 부으사 가난한 자에게 아름다운 소식을 전하게 하려 하심이라 나를 보내사 마음이 상한 자를 고치며 포로 된 자에게 자유를, 갇힌 자에게 놓임을 전파하며"}],prayer:"주님, 제가 아이들에게 남겨 줄 유산은 경건한 삶의 보상과 하나님 앞에서의 깨끗한 마음이 되기를 기도합니다.\n\n우리 가문으로부터 물려 받은 모든 잘못된 굴레를 제게서 벗겨 주옵기를 빕니다. 우리 가문의 죄를 하나님께 고백합니다. 그 죄가 무엇인지 저는 낱낱이 모르나 하나님께서는 알고 계심을 제가 아나이다. 구하옵나니 용서하시고 구출해 주옵소서.\n\n만일 우리 집안의 과거에 있었던 원수의 장난이 우리 아이의 인생을 잠식하려고 노린다면, 예수 그리스도 안에서 나에게 주신 능력과 권세로 명하노니, 파멸될지어다.\n\n우리 아이가 우리 가문의 잘못된 굴레를 물려받지 아니하고 \"창세로부터 너희를 위하여 예비된 나라를 상속하게\" (마 25:34) 하여 주시기를 기도합니다. 예수님 안에서 옛것은 지나가고 모든 것을 새롭게 하여 주셔서 감사합니다. 예수님의 이름으로 기도합니다. 아멘."}
};

let currentDay = 1;
const totalDays = 30;

function getState(){try{return JSON.parse(localStorage.getItem('prayer30')||'{}')}catch(e){return {}}}
function saveState(s){try{localStorage.setItem('prayer30',JSON.stringify(s))}catch(e){}}

function renderContent(){
  const data=days[currentDay];
  const state=getState();
  const key='d'+currentDay;
  const isDone=state[key]&&state[key].done;
  const memo=(state[key]&&state[key].memo)||'';

  document.getElementById('dayLabel').textContent='📅 '+currentDay+'일차';
  document.getElementById('badge').textContent=currentDay+' / '+totalDays;
  document.getElementById('memoArea').value=memo;
  document.getElementById('completeBtn').textContent=isDone?'✓ 오늘 기도 완료!':'오늘 기도 완료 체크 ✓';
  document.getElementById('completeBtn').className='complete-btn'+(isDone?' done':'');

  const doneCount=Object.values(state).filter(v=>v&&v.done).length;
  const pct=Math.round((doneCount/totalDays)*100);
  document.getElementById('progbar').style.width=Math.max(pct,2)+'%';
  document.getElementById('proglabel').textContent=doneCount+'일 완료 ('+pct+'%)';
  document.getElementById('prevBtn').disabled=currentDay<=1;
  document.getElementById('nextBtn').disabled=currentDay>=totalDays;

  if(!data){
    document.getElementById('content').innerHTML='<div class="section"><div class="coming-soon"><div class="coming-soon-icon">🙏</div>'+currentDay+'일차 기도문을 곧 추가할 예정이에요.</div></div>';
    renderDots();return;
  }

  const versesHtml=data.verses.map(v=>'<div class="verse-item"><div class="verse-ref">'+v.ref+'</div><div class="verse-text">'+v.text+'</div></div>').join('');
  const prayerHtml=data.prayer.split('\n').filter(l=>l.trim()).map(p=>'<p>'+p+'</p>').join('');
  const quoteAttr=data.quote.author?'<div class="attr">— '+data.quote.author+'</div>':'';

  document.getElementById('content').innerHTML=
    '<div class="section"><div class="section-title">✦ 오늘의 말씀</div><div class="quote-card"><p>'+data.quote.text+'</p>'+quoteAttr+'</div></div>'+
    '<div class="section"><div class="section-title">📖 묵상 말씀</div>'+versesHtml+'</div>'+
    '<div class="section"><div class="section-title">🙏 오늘의 기도문</div><div class="prayer-text">'+prayerHtml+'</div></div>';
  renderDots();
}

function renderDots(){
  const state=getState();
  let html='';
  for(let i=1;i<=totalDays;i++){
    const key='d'+i;
    const isDone=state[key]&&state[key].done;
    const isActive=i===currentDay;
    const hasContent=!!days[i];
    let cls='dot'+(isActive?' active':(isDone?' done':(!hasContent?' empty':'')));
    let click=hasContent?'onclick="jumpDay('+i+')"':'title="준비중"';
    html+='<div class="'+cls+'" '+click+'>'+i+'</div>';
  }
  document.getElementById('dayDots').innerHTML=html;
}

function changeDay(d){saveMemo();currentDay=Math.max(1,Math.min(30,currentDay+d));renderContent();}
function jumpDay(d){if(!days[d])return;saveMemo();currentDay=d;renderContent();}
function saveMemo(){const state=getState();const key='d'+currentDay;if(!state[key])state[key]={};state[key].memo=document.getElementById('memoArea').value;saveState(state);}
function toggleComplete(){saveMemo();const state=getState();const key='d'+currentDay;if(!state[key])state[key]={};state[key].done=!state[key].done;saveState(state);renderContent();}
document.getElementById('memoArea').addEventListener('blur',saveMemo);
renderContent();
</script>
</body>
</html>
